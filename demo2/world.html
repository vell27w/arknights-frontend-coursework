            <div class="menu-item" data-text="大地被起因不明的天灾四处肆虐，经由天灾席卷过的土地上出现了大量的神秘矿物——“源石”。依赖于技术的进步，源石蕴含的能量投入工业后使得文明顺利迈入现代，与此同时，源石本身也催生出“感染者”的存在。">
                <span class="chinese">源石</span>
                <span class="english">ORIGINIUMS</span>
            </div>
            <div class="menu-item" data-text="源石被发现之后，人们发掘出一种通过它来施放一系列令物质改变原有性状的技术，这种技术被称为源石技艺，常被俗称为“法术”。源石技艺所运用的能源，一般被认为来自于源石本身。而人是否能施放法术，以及所能施放法术的形式、强度、效果等，通常受到先天具备的素质、后天对源石技艺的学习能力这两方面因素的制约。">

                <span class="english">ORIGINIUM ARTS</span>
            </div>

                <span class="chinese">整合运动</span>
                <span class="english">REUNION</span>
            </div>
            <div class="menu-item" data-text="被源石所感染的人。理论致死率100% ，死亡时存在扩散传染性以及潜在危险能力，是各国隔离驱逐的目标。长久以来，没人告诉他们该如何渡过余生，如今伴随着一位颠覆者的出现，越来越多的感染者被纳入一场名为“整合运动”的反抗浪潮。">
                <span class="chinese">感染者</span>
                <span class="english">INFECTED</span>

                <span class="chinese">移动城邦</span>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuItems = document.querySelectorAll('.menu-item');
        const textArea = document.querySelector('.text');

        menuItems.forEach(item => {
            item.addEventListener('mouseenter', function() {
                const text = this.getAttribute('data-text');
                textArea.textContent = text;
            });

            item.addEventListener('mouseleave', function() {
                textArea.textContent = ''; // 或者设置为默认文本
            });
        });
    });
</script>
