<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>生息演算</title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        text-align: center;
        background-image: url('picture/reclamation.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .container {
        color: white;
      width: 500px;
      height: 500px;
      border-radius: 50%; /* 圆形 */
      
      background-color: rgba(0, 0, 0, 0.3); /* 半透明背景 */
      padding: 20px;
      box-shadow: 0 0 20px #898a46fe;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1, h2, p {
      margin: 5px 0;
    }
    h1 {
        font-size: 12px;
    }
    h2 {
        font-size: 60px;
    }
    p.zh-CN {
        font-size: 40px;
    }
    p.en {
        font-size: 10px;
    }
    button {
      padding: 10px 20px;
      background-color: transparent;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 20px;
    }

    button:hover {
      background-color: white;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TALES WITHIN</h1>
    <h2>T H E  S Λ N D</h2>
    <p class="zh-CN">沙洲遗闻</p>
    <p class="en">Reclamation Algorithm</p>
    <button>登录查看生存天数</button>
  </div>
</body>
</html>
