<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>冬隐归路宣传页</title>
  <link rel="stylesheet" href="style.css">
  <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-image: url('picture/bg.c03d00a6.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
        }

        .container {
        display: flex;
        height: 100vh;
        background-size: cover;
        background-position: center;
        position: relative;
        color: white;
        }

        .sidebar {
        width: 250px;
        padding: 40px 20px;
        }

        .logo {
            width: 250px;
            height: auto;
        }

        .menu li {
            margin: 12px 0;
            list-style: none;
            cursor: pointer;
            font-size: 25px;
            color: #ccc;
        }

        .main {
        flex: 1;
        position: relative;
        padding: 40px;
        max-width: 100%;
        height: auto;
        background-image: url('picture/anime_bg.jpg'); /* 替换成你的图 */
        }

        .title-tag {
        position: absolute;
        bottom: 160px;
        left: 60px;
        background: #e75c26;
        padding: 6px 12px;
        font-size: 16px;
        font-weight: bold;
        }

        .launch-time {
        position: absolute;
        bottom: 120px;
        left: 60px;
        font-size: 28px;
        }

        .launch-label {
        position: absolute;
        bottom: 80px;
        left: 60px;
        font-size: 36px;
        font-weight: bold;
        }

        .platform {
        position: absolute;
        bottom: 30px;
        right: 60px;
        display: flex;
        align-items: center;
        gap: 10px;
        }

        .platform img {
        width: 30px;
        height: 30px;
        }

        .follow-btn {
        background: #f55;
        border: none;
        color: white;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        width: 150px;
        height: 75px;
        font-size: 25px;
        }

  </style>
</head>
<body>
  <div class="container">
    <nav class="sidebar">
        <div class="logoBox">
            <img class="logo" src="picture/Logo_明日方舟.svg"></img>
        </div>
      <ul class="menu">
        <li>主页</li>
        <li>活动</li>
        <li>资讯</li>
        <li>PV</li>
        <li>简介</li>
        <li>故事</li>
        <li>角色</li>
        <li>音乐</li>
        <li>画廊</li>
        <li>游戏官网</li>
      </ul>
    </nav>

    <div class="main">
      <div class="title-tag">明日方舟：冬隐归路</div>
      <div class="launch-time">2023／10／7 00:23</div>
      <div class="launch-label">正式上线</div>

      <div class="platform">
        <span>放送平台</span>
        <img src="https://www.bilibili.com/favicon.ico" alt="bilibili" />
        <a href="https://www.bilibili.com/blackboard/activity-NRdJjEr6Qq.html" target="_blank">
            <button class="follow-btn">点击追番</button>
          </a>
      </div>
    </div>
  </div>
</body>
</html>
